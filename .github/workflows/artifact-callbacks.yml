name: Artifact Callbacks

on:
  push:
    branches: [main]
    paths:
      - 'plugins/artifact-callbacks*/**'
      - '.claude-plugin/marketplace.json'
      - 'README.md'
      - '.github/workflows/artifact-callbacks.yml'
      - '.github/workflows/artifact-release.yml'
      - 'RELEASING.md'
      - 'scripts/*marketplace*'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/artifact-callbacks*/**'
      - '.claude-plugin/marketplace.json'
      - 'README.md'
      - '.github/workflows/artifact-callbacks.yml'
      - '.github/workflows/artifact-release.yml'
      - 'RELEASING.md'
      - 'scripts/*marketplace*'
  workflow_dispatch:

defaults:
  run:
    working-directory: plugins/artifact-callbacks
    shell: bash

permissions:
  contents: read

concurrency:
  group: artifact-callbacks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Skip the OS matrices for pull requests that change only the root docs
        id: diff
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -vxE 'README\.md|RELEASING\.md' > /dev/null; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  typecheck:
    name: Typecheck (node sources)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - name: Install dev dependencies
        run: npm ci
      # The hooks module's tsc check needs .claude-plugin/types, which only a session
      # loading the mod writes; the plugin job checks that module with validate and test.
      - name: Typecheck
        run: npm run typecheck:node

  node:
    name: Node tests (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22.18.0', '24']
        exclude:
          - os: macos-latest
            node-version: '22.18.0'
    steps:
      - name: Keep LF line endings on Windows
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Node version
        run: node --version
      - name: Unit tests
        run: npm run test:unit
      - name: Conformance
        run: npm run test:conformance

  browser:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - name: Install Playwright
        # Dev-time only: the plugin ships no node_modules, so nothing is saved to package.json.
        run: npm install --no-save --no-package-lock playwright@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser
      - name: Install Claude Code and tmux for the real-session test
        run: |
          npm install -g @anthropic-ai/claude-code
          sudo apt-get install -y tmux
      - name: Real-session end-to-end (skips, saying why, without model access)
        run: npm run test:e2e

  channel:
    name: Channel adapter (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/artifact-callbacks-channel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ['22.18.0', '24']
        exclude:
          - os: macos-latest
            node-version: '22.18.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dev dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: MCP, supervision and sidecar drift tests
        run: npm run test:unit

  channel-browser:
    name: Channel adapter browser tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/artifact-callbacks-channel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser

  plugin:
    name: Claude plugin validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace
        run: claude plugin validate .
      - name: Validate the plugins
        run: |
          for dir in plugins/artifact-callbacks*/; do
            if [ -f "$dir.claude-plugin/plugin.json" ]; then
              echo "::group::claude plugin validate $dir"
              claude plugin validate "$dir"
              echo "::endgroup::"
            fi
          done
      - name: Verify clean release-pinned marketplace installs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-marketplace-install.mjs
      - name: Hooks module tests
        run: |
          for dir in plugins/artifact-callbacks*/; do
            if compgen -G "$dir"'hooks/*.test.ts*' > /dev/null; then
              echo "::group::claude plugin test $dir"
              claude plugin test "$dir"
              echo "::endgroup::"
            fi
          done

  docs:
    name: Docs tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - name: Release pin policy and promotion tests
        working-directory: .
        run: |
          node scripts/marketplace.mjs check
          node --test scripts/marketplace.test.mjs
      - name: README, SKILL.md, manifest and CI checks
        run: npm run test:docs
